<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <title>NutriEntrena — Nutrición</title>
  <!-- El origen de la API: el mismo que sirve esta página. -->
  <script src="js/api-base.js"></script>
  <script>
    (function(){ var t=localStorage.getItem('token'),r=localStorage.getItem('role_id')||'';
      if(!t){location.replace('login.html');return;} if(r&&r!=='6'){location.replace('dashboard.html');} })();
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--indigo:#4F46E5;--indigo-dark:#4338CA;--indigo-pale:#EEF2FF;--green:#059669;--amber:#F59E0B;--red:#DC2626;--gray-bg:#F8FAFC;--sidebar-w:240px;}
    body{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;background:var(--gray-bg);display:flex;height:100vh;overflow:hidden;}
    .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:#fff;border-right:1px solid #E5E7EB;display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
    .sidebar-logo{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid #EBEBEB;}
    .sl-mark{width:40px;height:40px;border-radius:9px;background:url('logo.webp') no-repeat 50% 41%;background-size:210px;flex-shrink:0;}
    .sl-txt{display:flex;flex-direction:column;line-height:1.15;}
    .sl-txt b{font-size:17px;font-weight:800;letter-spacing:.3px;}
    .sl-txt b .n1{color:var(--indigo);}.sl-txt b .n2{color:var(--green);}
    .sl-txt small{color:#6B7280;font-size:11px;margin-top:2px;}
    .sidebar-nav{flex:1;padding:12px 0;}
    .nav-section{padding:12px 20px 4px;font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#374151;cursor:pointer;font-size:14px;transition:all .15s;border-left:3px solid transparent;text-decoration:none;}
    .nav-item:hover{background:#F8FAFC;color:var(--indigo);}
    .nav-item.active{background:#EEF2FF;color:var(--indigo);border-left-color:var(--indigo);font-weight:600;}
    .nav-item svg{flex-shrink:0;opacity:.75;}
    .nav-item.active svg,.nav-item:hover svg{opacity:1;}
    .nav-item.disabled{opacity:.6;cursor:default;}
    .nav-item.disabled:hover{background:none;color:#374151;}
    .nav-soon-tag{margin-left:auto;font-size:9px;font-weight:700;color:#9CA3AF;background:#F3F4F6;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
    .sidebar-user{padding:14px 20px;border-top:1px solid #F3F4F6;display:flex;align-items:center;gap:10px;}
    .s-avatar{width:34px;height:34px;border-radius:50%;background:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex-shrink:0;overflow:hidden;}
    .s-avatar img{width:100%;height:100%;object-fit:cover;}
    .user-info{flex:1;min-width:0;}.user-name{color:#111827;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.user-role{color:#6B7280;font-size:11px;}
    .logout-btn{background:none;border:none;color:#9CA3AF;cursor:pointer;padding:4px;border-radius:4px;display:flex;}
    .logout-btn:hover{color:#EF4444;}

    .main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .topbar{background:#fff;border-bottom:1px solid #E5E7EB;padding:0 28px;height:64px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
    .menu-btn{display:none;background:none;border:none;cursor:pointer;color:#374151;padding:6px;border-radius:8px;}
    .menu-btn:hover{background:#F3F4F6;}
    .topbar-title{font-size:17px;font-weight:800;color:#111827;flex:1;}

    .content{flex:1;overflow-y:auto;padding:26px 28px 40px;}
    .content-inner{max-width:760px;margin:0 auto;}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
    .page-head h1{font-size:26px;font-weight:800;color:#111827;}
    .page-head p{font-size:14px;color:#6B7280;margin-top:2px;}
    .btn-list{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid #A7F3D0;background:#ECFDF5;color:var(--green);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
    .btn-list:hover{background:#D1FAE5;}

    /* ── Las dos pestañas ─────────────────────────────────────────────────
       "Mi plan" es lo de siempre. "Recetas" es el catálogo que suben el coach
       y el centro, que hasta ahora el cliente no podía ver por ningún lado
       aunque estuviera hecho para él. */
    .nt-tabs{display:flex;gap:6px;background:#EFF1F5;border-radius:12px;padding:4px;margin-bottom:16px;}
    .nt-tab{flex:1;padding:9px 12px;border:none;border-radius:9px;background:none;color:#6B7280;
      font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
    .nt-tab.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(16,24,40,.08);}

    /* ── Consumido hoy ────────────────────────────────────────────────────
       Va a 0 o al total, no a un punto intermedio: la pantalla no tiene
       ninguna casilla por comida, solo el botón del final. Fingir un
       porcentaje sería inventarse un dato que nadie ha dado. */
    .cons{margin-top:14px;}
    .cons-fila{display:flex;align-items:baseline;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
    .cons-fila b{color:#6B7280;font-weight:600;}
    .cons-fila span{color:#111827;font-weight:700;}
    .cons-barra{height:6px;border-radius:4px;background:#EEF0F3;overflow:hidden;}
    .cons-barra i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .3s;}

    .btn-cambiar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
      padding:11px 14px;border:1px solid #E5E7EB;border-radius:11px;background:#fff;color:#374151;
      font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
    .btn-cambiar:hover{border-color:var(--indigo);color:var(--indigo);}

    /* El 🔄 de cada comida: lleva a Recetas ya filtrado por esa comida. */
    .meal-swap{width:32px;height:32px;border-radius:9px;border:none;background:#EEF2FF;color:var(--indigo);
      display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
    .meal-swap:hover{background:#E0E7FF;}

    .btn-dia{display:block;width:100%;margin:6px 0 4px;padding:14px;border-radius:13px;
      border:1px solid #E5E7EB;background:#fff;color:#111827;font-family:inherit;
      font-size:14px;font-weight:700;cursor:pointer;}
    .btn-dia:hover{border-color:var(--indigo);color:var(--indigo);}
    .btn-dia.hecho{background:#ECFDF5;border-color:#A7F3D0;color:var(--green);}
    .btn-dia:disabled{opacity:.55;cursor:default;}
    .btn-dia:disabled:hover{border-color:#E5E7EB;color:#111827;}

    /* ── El catálogo de recetas ───────────────────────────────────────────*/
    .rc-buscar{position:relative;margin-bottom:12px;}
    .rc-buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;}
    .rc-buscar input{width:100%;padding:11px 14px 11px 38px;border:1px solid #E5E7EB;border-radius:11px;
      font-family:inherit;font-size:13.5px;color:#111;outline:none;background:#fff;}
    .rc-buscar input:focus{border-color:var(--indigo);}
    .rc-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;}
    .rc-chip{padding:7px 14px;border-radius:20px;border:1px solid #E5E7EB;background:#fff;color:#6B7280;
      font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .rc-chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff;}
    .rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
    .rc-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;
      box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;flex-direction:column;}
    .rc-foto{position:relative;aspect-ratio:4/3;background:#F3F4F6;overflow:hidden;}
    .rc-foto img{width:100%;height:100%;object-fit:cover;display:block;}
    /* Sin foto no se deja un hueco gris: se pone la inicial, que al menos
       distingue una tarjeta de otra de un vistazo. */
    .rc-foto .sinfoto{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:800;color:#C7CBD3;background:#F3F4F6;}
    .rc-encaja{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;
      padding:4px 9px;border-radius:20px;background:var(--green);color:#fff;font-size:10.5px;font-weight:700;}
    .rc-cuerpo{padding:10px 11px 12px;}
    .rc-nm{font-size:13px;font-weight:700;color:#111827;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .rc-meta{display:flex;gap:10px;margin-top:6px;font-size:11px;color:#9CA3AF;font-weight:600;}
    .rc-meta span{display:inline-flex;align-items:center;gap:3px;}

    .weekbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
    .wday{flex:1;min-width:44px;background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:9px 4px;text-align:center;cursor:pointer;transition:.15s;}
    .wday:hover{border-color:#C7D2FE;}
    .wday.sel{background:var(--indigo);border-color:var(--indigo);}
    .wday .wl{font-size:12px;font-weight:700;color:#6B7280;}
    .wday .wn{font-size:13px;font-weight:700;color:#111827;margin-top:2px;}
    .wday.sel .wl,.wday.sel .wn{color:#fff;}

    .day-card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
    .day-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .day-name{font-size:18px;font-weight:800;color:#111827;}
    .day-kcal{font-size:16px;font-weight:800;color:var(--green);}
    .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .macro{background:#F9FAFB;border-radius:12px;padding:12px;text-align:center;}
    .macro-v{font-size:17px;font-weight:800;}
    .macro-l{font-size:11px;color:#9CA3AF;margin-top:1px;}
    .macro.p .macro-v{color:var(--green);}.macro.c .macro-v{color:var(--amber);}.macro.g .macro-v{color:var(--red);}
    .day-note{margin-top:12px;font-size:13px;color:#9CA3AF;text-align:center;}

    .meal-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.03);transition:border-color .15s;}
    .meal-card.open{border-color:var(--indigo);}
    .meal-head{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;user-select:none;}
    .meal-ico{width:42px;height:42px;border-radius:12px;background:var(--indigo-pale);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .meal-info{flex:1;min-width:0;}
    .meal-nm{font-size:15px;font-weight:800;color:#111827;}
    .meal-que{font-size:13.5px;color:#374151;margin-top:2px;line-height:1.35;}
    .meal-sub{font-size:13px;color:#9CA3AF;margin-top:1px;}
    .meal-chev{color:#9CA3AF;flex-shrink:0;transition:transform .2s;}
    .meal-card.open .meal-chev{transform:rotate(180deg);color:var(--indigo);}
    .meal-foods{display:none;border-top:1px solid #F3F4F6;}
    .meal-card.open .meal-foods{display:block;}
    .mf-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #F7F8FA;font-size:14px;}
    .mf-row:last-child{border-bottom:none;}
    .mf-row .nm{color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mf-row .qty{color:#111827;font-weight:700;white-space:nowrap;}
    .mf-empty{padding:12px 16px;font-size:13px;color:#9CA3AF;border-top:1px solid #F3F4F6;}

    .empty{padding:44px 22px;text-align:center;color:#6B7280;font-size:14px;background:#fff;border:1px solid #E5E7EB;border-radius:16px;}

    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2937;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:400;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;}
    .sidebar-overlay.open{display:block;}
    @media(max-width:768px){
      body{overflow:auto;}
      .sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);transition:transform .25s;z-index:200;}
      .sidebar.open{transform:translateX(0);}
      .menu-btn{display:flex;align-items:center;justify-content:center;}
      .content{padding:18px 14px 40px;}
      .page-head h1{font-size:22px;}
    }

    /* ── Lista de la compra ───────────────────────────────────────────────
       Se usa de pie en un supermercado, con una mano: renglones altos, texto
       grande y la casilla donde cae el pulgar. */
    .lc-back{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:500;}
    .lc-back.open{display:flex;align-items:center;justify-content:center;padding:20px;}
    .lc-panel{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:calc(100vh - 40px);
      display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.28);}
    .lc-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;}
    .lc-head .ico{color:var(--indigo);flex-shrink:0;margin-top:2px;}
    .lc-head h2{font-size:18px;font-weight:700;color:#111827;line-height:1.2;}
    .lc-head .sub{font-size:12px;color:#9CA3AF;margin-top:3px;}
    .lc-x{margin-left:auto;background:#F3F4F6;border:none;width:30px;height:30px;border-radius:50%;
      cursor:pointer;color:#6B7280;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .lc-x:hover{background:#E5E7EB;}
    .lc-prog{height:4px;background:#E5E7EB;border-radius:4px;margin:0 20px;overflow:hidden;}
    .lc-prog i{display:block;height:100%;background:var(--indigo);width:0;transition:width .2s;}
    .lc-tabs{display:flex;gap:8px;padding:14px 20px 10px;}
    .lc-tab{flex:1;padding:9px 10px;border-radius:10px;border:1px solid #E5E7EB;background:#F9FAFB;
      color:#6B7280;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
    .lc-tab.on{background:#fff;border-color:var(--indigo);color:var(--indigo);box-shadow:0 1px 3px rgba(0,0,0,.06);}
    .lc-body{flex:1;overflow-y:auto;padding:4px 20px 12px;}
    .lc-cat{font-size:10.5px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.8px;
      margin:16px 0 4px;display:flex;align-items:center;gap:7px;}
    .lc-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #F3F4F6;cursor:pointer;}
    .lc-item:last-child{border-bottom:none;}
    .lc-box{width:21px;height:21px;border-radius:50%;border:1.8px solid #D1D5DB;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;color:#fff;}
    .lc-item.done .lc-box{background:var(--indigo);border-color:var(--indigo);}
    .lc-nm{flex:1;font-size:14px;color:#111827;font-weight:500;}
    .lc-item.done .lc-nm{color:#9CA3AF;text-decoration:line-through;}
    .lc-qty{font-size:13px;color:#6B7280;font-weight:600;white-space:nowrap;}
    .lc-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid #F3F4F6;}
    .lc-dl{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;
      border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
      border:1px solid #E5E7EB;background:#fff;color:#374151;}
    .lc-dl:hover{background:#F9FAFB;}
    .lc-dl.pri{background:var(--indigo);border-color:var(--indigo);color:#fff;}
    .lc-dl.pri:hover{background:var(--indigo-dark);}
    .lc-vacio{padding:38px 10px;text-align:center;color:#6B7280;font-size:14px;}

    /* Aviso de que el plan es el mismo todos los días. Discreto: es una
       aclaración, no un problema. */
    .plan-aviso{background:#EEF2FF;border:1px solid #DDE3FF;color:#4338CA;
      border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.45;margin-bottom:14px;}
  </style>
<script src="js/org-context.js"></script>
<script src="js/nav-roles.js"></script>
<script src="js/lista-compra.js"></script>
<link rel="stylesheet" href="css/nav-cliente.css">
<script src="js/nav-cliente.js"></script>
</head>

<aside class="sidebar" id="sidebar">

  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>

    <a class="nav-item" href="client-calendario.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendario</a>

    <a class="nav-item active" href="client-nutricion.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>Nutrición</a>

      <div class="nav-section">Cuenta</div>
    <a class="nav-item" href="client-perfil.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Perfil</a>
</nav>
  <div class="sidebar-user">
    <div class="s-avatar" id="sidebarAvatar">C</div>
    <div class="user-info"><div class="user-name" id="sidebarName">Cargando…</div><div class="user-role">Cliente</div></div>
    <button class="logout-btn" onclick="logout()" title="Cerrar sesión"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menú"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="topbar-title">Nutrición</div>
  </div>

  <div class="content">
    <div class="content-inner">
      <div class="page-head">
        <div>
          <h1>Plan Nutricional</h1>
          <p id="menuSub">Menú semanal personalizado</p>
        </div>
        <button class="btn-list" id="btnLista" onclick="abrirLista()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          Lista
        </button>

      <div class="nt-tabs">

        <button class="nt-tab" id="tabRecetas" onclick="abrirRecetas()">Recetas</button>

      <div id="panelPlan">

        <div class="weekbar" id="weekbar" style="display:none;"></div>

          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="rcBuscar" placeholder="Buscar receta…" autocomplete="off" oninput="rcBuscarCambia(this.value)"/>
        </div>
        <div class="rc-chips" id="rcChips"></div>
        <div class="rc-grid" id="rcGrid"><div class="empty">Cargando recetas…</div></div>

</div>

<div class="lc-back" id="lcBack" onclick="if(event.target===this)cerrarLista()">
  <div class="lc-panel" role="dialog" aria-modal="true" aria-labelledby="lcTitulo">
    <div class="lc-head">
      <span class="ico"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span>

      <button class="lc-dl pri" id="lcPdf" onclick="lcDescargar('pdf')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PDF</button>

<div class="toast" id="toast"></div>

<script>
  const API = API_BASE;
  const token = localStorage.getItem('token');
  const headers = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });
  function esc(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function logout(){ localStorage.clear(); location.href='login.html'; }
  function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
  function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
  let _tt; function soon(){ const t=document.getElementById('toast'); t.textContent='Disponible próximamente'; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200); }

  var ICO_SWAP = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';

  function mealIcon(name){
    var n=(name||'').toLowerCase();
    var COFFEE='<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>';
    var APPLE='<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>';
    var FORK='<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></svg>';
    if(/desayun/.test(n))return COFFEE;
    if(/media|merienda|snack|colaci/.test(n))return APPLE;
    if(/comida|almuerzo|cena/.test(n))return FORK;
    return FORK;
  }
  function g(v){ return (v==null) ? '—' : (Math.round(v)+'g'); }

  let _days=[], _sel=0;

  function renderWeek(){
    var bar=document.getElementById('weekbar');
    bar.style.display='';
    bar.innerHTML=_days.map(function(d,i){
      var dt=d.date?new Date(d.date+'T00:00:00').getDate():'';
      return '<div class="wday'+(i===_sel?' sel':'')+'" onclick="selectDay('+i+')"><div class="wl">'+esc(d.label)+'</div><div class="wn">'+dt+'</div></div>';
    }).join('');
  }
  function renderDay(){
    var d=_days[_sel], box=document.getElementById('daybox');
    if(!d){ box.innerHTML='<div class="empty">Sin datos para este día.</div>'; return; }
    var html='<div class="day-card"><div class="day-top"><div class="day-name">'+esc(d.name)+'</div>'
      + (d.kcal!=null?'<div class="day-kcal">'+Math.round(d.kcal)+' kcal</div>':'')+'</div>';
    if(d.has_diet){
      html+='<div class="macros">'
        +'<div class="macro p"><div class="macro-v">'+g(d.protein)+'</div><div class="macro-l">Proteína</div></div>'
        +'<div class="macro c"><div class="macro-v">'+g(d.carbs)+'</div><div class="macro-l">Carbohidratos</div></div>'
        +'<div class="macro g"><div class="macro-v">'+g(d.fats)+'</div><div class="macro-l">Grasa</div></div>'
        +'</div>';
      /* Consumido hoy. Va a 0 o al total: la pantalla no tiene casilla por
         comida, así que un punto intermedio sería un dato inventado. */
      var tot = (d.kcal!=null) ? Math.round(d.kcal) : null;
      var comido = d.completed ? (tot||0) : 0;
      html+='<div class="cons"><div class="cons-fila"><b>Consumido hoy</b>'
        +'<span>'+comido+(tot!=null?' / '+tot:'')+' kcal</span></div>'
        +'<div class="cons-barra"><i style="width:'+(tot?Math.min(100,Math.round(comido*100/tot)):0)+'%"></i></div></div>';
      html+='<button class="btn-cambiar" onclick="cambiarComida(null)">'
        + ICO_SWAP + 'Ver recetas para cambiar una comida</button>';
    } else {
      html+='<div class="day-note">No hay menú asignado para este día.</div>';
    }
    html+='</div>';
    (d.meals||[]).forEach(function(m,mi){
      var sub=[m.time, (m.kcal!=null?m.kcal+' kcal':null)].filter(Boolean).join(' · ');
      var foods=m.foods||[];
      var foodsHtml = foods.length
        ? foods.map(function(f){ return '<div class="mf-row"><span class="nm">'+esc(f.name||'Alimento')+'</span><span class="qty">'+esc(fmtQty(f))+'</span></div>'; }).join('')
        : '<div class="mf-empty">Sin alimentos en esta comida.</div>';
      var chev='<svg class="meal-chev" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
      html+='<div class="meal-card'+(mi===0?' open':'')+'" id="mealc-'+mi+'">'
        +'<div class="meal-head" onclick="toggleMeal('+mi+')"><div class="meal-ico">'+mealIcon(m.name)+'</div>'
        /* El subtítulo va DEBAJO del nombre y antes de la hora: es lo que el
           cliente busca —qué come— y el nombre solo le dice cuándo. */
        +'<div class="meal-info"><div class="meal-nm">'+esc(m.name||'Comida')+'</div>'
        +(m.subtitle?'<div class="meal-que">'+esc(m.subtitle)+'</div>':'')
        +'<div class="meal-sub">'+esc(sub||'')+'</div></div>'
        /* Va FUERA del onclick de la cabecera: si estuviera dentro, tocar el
           🔄 abriría la comida además de saltar a las recetas. */
        +'<button class="meal-swap" title="Cambiar esta comida" aria-label="Cambiar esta comida"'
        +' onclick="event.stopPropagation();cambiarComida('+JSON.stringify(m.name||'').replace(/"/g,'&quot;')+')">'
        + ICO_SWAP + '</button>'
        +chev+'</div>'
        +'<div class="meal-foods">'+foodsHtml+'</div></div>';
    });
    if(d.has_diet && !(d.meals||[]).length){ html+='<div class="empty">Este día no tiene comidas cargadas.</div>'; }
    /* Solo en días que ya han pasado o el de hoy: marcar el jueves como
       comido en lunes no es un dato, es un descuido. */
    if(d.has_diet){
      var futuro = d.date && d.date > (new Date()).toISOString().slice(0,10);
      html+='<button class="btn-dia'+(d.completed?' hecho':'')+'" id="btnDia"'
        + (futuro?' disabled title="Ese día todavía no ha llegado"':'')
        + ' onclick="marcarDia()">'
        + (d.completed ? '✓ Día completado' : 'Marcar día como completado')
        + '</button>';
    }
    box.innerHTML=html;
  }
  function fmtQty(f){
    var q=f.quantity; if(q==null) q='';
    else { q=Math.round(parseFloat(q)*100)/100; if(q%1===0) q=q.toFixed(0); }
    var u=(f.unit||'g'); if(u==='unidad'||u==='ud') return (q||'1')+' ud';
    if(['g','ml','kg','l','mg'].indexOf(u)>=0) return q+u;
    return (q!==''? q+' ' : '')+u;
  }
  /* ── Las dos pestañas ──────────────────────────────────────────────────
     "Ver recetas para cambiar una comida" y el 🔄 de cada comida llevan aquí,
     no a otra página: cambiar una comida es una decisión que se toma mirando
     el plan, y salir de la pantalla obliga a acordarse de a qué se volvía. */
  var _pestana = 'plan';

  /* Cambiar de pestaña y nada más. Quién decide el filtro es quien llama:
     mezclar las dos cosas aquí fue lo que hizo que volver a Recetas repintara
     la lista vieja con el filtro nuevo puesto en las pastillas. */
  function verPestana(cual){
    _pestana = cual;
    document.getElementById('tabPlan').classList.toggle('on', cual === 'plan');
    document.getElementById('tabRecetas').classList.toggle('on', cual === 'recetas');
    document.getElementById('panelPlan').style.display = cual === 'plan' ? '' : 'none';
    document.getElementById('panelRecetas').style.display = cual === 'recetas' ? '' : 'none';
    // La lista de la compra es del plan: con las recetas delante no pinta nada.
    document.getElementById('btnLista').style.display = cual === 'plan' ? '' : 'none';
    var c = document.querySelector('.content'); if (c) c.scrollTop = 0;
  }

  /* La pestaña, a secas: el catálogo entero. Se limpia lo que hubiera puesto
     un "cambiar esta comida" anterior, porque "encaja con cena" solo responde
     a una pregunta que aquí no se ha hecho. */
  function abrirRecetas(){
    _rcQueCambio = null;
    _rcTipo = null;
    verPestana('recetas');
    cargarRecetas();
  }

  /* Cambiar ESTA comida: se salta a Recetas con el filtro puesto en el tipo de
     comida que se quiere cambiar, y las que encajan salen marcadas. */
  function cambiarComida(nombreComida){
    _rcQueCambio = nombreComida || null;
    _rcTipo = _tipoDeComida(nombreComida);
    document.getElementById('rcBuscar').value = '';
    _rcBusca = '';
    verPestana('recetas');
    cargarRecetas();
  }

  /* El nombre de la comida del plan ("Media mañana") y el tipo con el que el
     coach etiqueta la receta no siempre se escriben igual. Se compara sin
     acentos ni mayúsculas, y si no hay pareja no se filtra: enseñar el
     catálogo entero es mejor que enseñarlo vacío. */
  function _sinAcentos(t){
    return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  }
  function _tipoDeComida(nombre){
    var n = _sinAcentos(nombre);
    if (!n) return null;
    for (var i=0;i<_rcTipos.length;i++){
      if (_sinAcentos(_rcTipos[i]) === n) return _rcTipos[i];
    }
    return null;
  }

  // ── El catálogo ─────────────────────────────────────────────────────────
  var _rcItems = [], _rcTipos = [], _rcTipo = null, _rcBusca = '', _rcQueCambio = null, _rcTimer = null;

  function rcBuscarCambia(v){
    _rcBusca = v || '';
    // Se espera a que pare de escribir: una petición por tecla son diez
    // peticiones para buscar "tortilla".
    clearTimeout(_rcTimer);
    _rcTimer = setTimeout(cargarRecetas, 300);
  }

  function rcFiltrar(tipo){
    _rcTipo = (_rcTipo === tipo) ? null : tipo;
    cargarRecetas();
  }

  async function cargarRecetas(){
    var q = [];
    if (_rcBusca.trim()) q.push('search=' + encodeURIComponent(_rcBusca.trim()));
    if (_rcTipo) q.push('meal_type=' + encodeURIComponent(_rcTipo));
    try{
      const r = await fetch(API + '/client/recipes' + (q.length ? '?' + q.join('&') : ''), { headers: headers() });
      const d = await r.json();
      var data = (d && d.data) || {};
      _rcItems = data.items || [];
      // Las pastillas se quedan con TODOS los tipos, no con los del resultado
      // filtrado: si no, al filtrar por "Cena" desaparecen las demás y no hay
      // forma de volver.
      if ((data.meal_types || []).length) _rcTipos = data.meal_types;
      document.getElementById('tabRecetas').textContent = 'Recetas (' + (data.total || 0) + ')';
      rcPintar();
    }catch(e){
      document.getElementById('rcGrid').innerHTML =
        '<div class="empty">No se pudieron cargar las recetas.</div>';
    }
  }

  function rcPintar(){
    var chips = document.getElementById('rcChips');
    chips.innerHTML = '<button class="rc-chip' + (_rcTipo ? '' : ' on') + '"'
      + ' onclick="rcFiltrar(null)">Todas</button>'
      + _rcTipos.map(function(t){
          return '<button class="rc-chip' + (_rcTipo === t ? ' on' : '') + '"'
            + ' data-tipo="' + esc(t) + '" onclick="rcFiltrar(' + JSON.stringify(t).replace(/"/g,'&quot;') + ')">'
            + esc(t) + '</button>';
        }).join('');

    var grid = document.getElementById('rcGrid');
    if (!_rcItems.length){
      grid.innerHTML = '<div class="empty">'
        + (_rcBusca.trim() ? 'Ninguna receta se llama así.'
                           : 'Tu coach todavía no ha subido recetas.') + '</div>';
      return;
    }
    grid.innerHTML = _rcItems.map(function(r){
      var foto = r.image
        ? '<img src="' + esc(r.image) + '" alt="' + esc(r.name || '') + '" loading="lazy">'
        : '<div class="sinfoto">' + esc((r.name || '?').trim()[0] || '?') + '</div>';
      /* La marca verde solo cuando se viene de "cambiar una comida": fuera de
         ese momento, "encaja con cena" no responde a ninguna pregunta. */
      var encaja = (_rcQueCambio && r.meal_type && _sinAcentos(r.meal_type) === _sinAcentos(_rcQueCambio))
        ? '<span class="rc-encaja">✓ Encaja con ' + esc(String(_rcQueCambio).toLowerCase()) + '</span>' : '';
      var meta = [];
      if (r.prep_time != null) meta.push('<span>⏱ ' + esc(r.prep_time) + ' min</span>');
      if (r.kcal != null) meta.push('<span>🔥 ' + esc(r.kcal) + ' kcal</span>');
      return '<div class="rc-card" data-receta="' + esc(r.id) + '">'
        + '<div class="rc-foto">' + foto + encaja + '</div>'
        + '<div class="rc-cuerpo"><div class="rc-nm">' + esc(r.name || 'Receta') + '</div>'
        + '<div class="rc-meta">' + meta.join('') + '</div></div></div>';
    }).join('');
  }

  // ── Marcar el día ───────────────────────────────────────────────────────
  async function marcarDia(){
    var d = _days[_sel];
    if (!d || !d.date) return;
    var btn = document.getElementById('btnDia');
    if (btn) btn.disabled = true;
    var quiero = !d.completed;
    try{
      const r = await fetch(API + '/client/nutrition/day/' + encodeURIComponent(d.date) + '/completado',
        { method:'POST', headers: headers(), body: JSON.stringify({ completado: quiero }) });
      if (!r.ok){
        var je = await r.json().catch(function(){ return {}; });
        throw new Error(je.message || je.detail || '');
      }
      d.completed = quiero;
      renderWeek(); renderDay();
      soon2(quiero ? 'Día marcado como completado' : 'Día desmarcado');
    }catch(e){
      soon2(e.message || 'No se pudo guardar', true);
      if (btn) btn.disabled = false;
    }
  }

  function toggleMeal(mi){ var el=document.getElementById('mealc-'+mi); if(el) el.classList.toggle('open'); }
  function selectDay(i){ _sel=i; renderWeek(); renderDay();
    // Con la lista abierta, cambiar de día tiene que cambiar la lista:
    // si no, se compra lo del día anterior.
    if(document.getElementById('lcBack').classList.contains('open')) lcPintar();
  }

  async function loadProfile(){
    try{ const r=await fetch(API+'/auth/me',{headers:headers()}); const d=await r.json(); const u=d.data||d;
      const name=u.name||u.email||'Cliente'; document.getElementById('sidebarName').textContent=name;
      const sav=document.getElementById('sidebarAvatar');
      if(u.photo){sav.innerHTML='<img src="'+u.photo+'" alt="">';sav.style.background='transparent';}else{sav.textContent=(name.trim()[0]||'C').toUpperCase();}
    }catch(e){}
  }
  async function loadNutrition(){
    try{
      const r=await fetch(API+'/client/nutrition',{headers:headers()});
      const d=await r.json(); const data=d.data||{};
      _days=data.days||[];
      if(!data.menu || !_days.length){
        document.getElementById('weekbar').style.display='none';
        document.getElementById('daybox').innerHTML='<div class="empty">Tu coach aún no te ha asignado un menú semanal.</div>';
        return;
      }
      document.getElementById('menuSub').textContent=data.menu.name || 'Menú semanal personalizado';

      /* Decir la verdad sobre qué tipo de plan es. Cuando el coach asigna una
         dieta suelta (sin menú semanal), esa misma dieta vale para los siete
         días — pero la tira de días de arriba invita a pensar que cada uno
         trae algo distinto, y cambiar de día no cambiaba nada sin explicación.
         Ahora se dice. */
      var aviso=document.getElementById('planAviso');
      if(data.plan_semanal===false){
        aviso.textContent='Tu coach te ha puesto el mismo plan para todos los días de la semana.';
        aviso.style.display='';
      } else {
        aviso.style.display='none';
      }

      var t=_days.findIndex(function(x){return x.is_today;}); _sel=t>=0?t:0;
      renderWeek(); renderDay();
    }catch(e){
      document.getElementById('daybox').innerHTML='<div class="empty">No se pudo cargar tu plan nutricional.</div>';
    }
  }

  /* ── Lista de la compra ──────────────────────────────────────────────────
     Las cuentas viven en js/lista-compra.js: juntar el mismo alimento y sumar
     lo que se puede sumar tiene bastante más filo del que parece. Aquí solo
     está la pantalla. */
  var _lcVista='dia', _lcPlano=[];

  function _lcClave(){
    // Lo marcado se recuerda por semana y por vista: la lista del lunes y la
    // de la semana son listas distintas, y la semana que viene es otra compra.
    var semana=(_days[0] && _days[0].date) || 'x';
    return 'lista-compra:'+semana+':'+(_lcVista==='dia'?('d'+_sel):'semana');
  }
  function _lcMarcados(){
    try{ return JSON.parse(localStorage.getItem(_lcClave())||'[]'); }catch(e){ return []; }
  }
  function _lcGuardar(l){
    // Si el navegador no deja guardar (modo privado, sitio bloqueado), la
    // lista tiene que seguir funcionando: solo se pierde el recuerdo.
    try{ localStorage.setItem(_lcClave(), JSON.stringify(l)); }catch(e){}
  }

  function _lcGrupos(){
    return listaCompra.listaDeCompra(_days, _lcVista==='dia' ? _sel : null);
  }
  function _lcTitulo(){
    var d=_days[_sel];
    return _lcVista==='dia' ? (d && d.name ? d.name : 'Día') : 'Semana completa';
  }

  function abrirLista(){
    document.getElementById('lcBack').classList.add('open');
    lcPintar();
  }
  function cerrarLista(){ document.getElementById('lcBack').classList.remove('open'); }
  function lcVer(v){
    _lcVista=v;
    document.getElementById('lcTabDia').classList.toggle('on', v==='dia');
    document.getElementById('lcTabSemana').classList.toggle('on', v==='semana');
    lcPintar();
  }

  function lcPintar(){
    var grupos=_lcGrupos(), marcados=_lcMarcados(), body=document.getElementById('lcBody');
    var total=listaCompra.contarItems(grupos), hechos=0;

    document.getElementById('lcTabDia').textContent =
      _lcVista==='dia' ? ('Día · '+_lcTitulo()) : 'Día';

    if(!total){
      body.innerHTML='<div class="lc-vacio">No hay alimentos en este plan.<br>Cuando tu coach te asigne un menú, aquí saldrá la compra.</div>';
      document.getElementById('lcSub').textContent=_lcTitulo()+' · sin alimentos';
      document.getElementById('lcProg').style.width='0';
      return;
    }

    /* El identificador del renglón NO se mete en el onclick: un alimento que
       se llame "Aceite d'oliva" partiría el atributo. Se guarda la lista
       aparte y el marcado va por posición. */
    _lcPlano=[];
    body.innerHTML=grupos.map(function(g){
      return '<div class="lc-cat">'+esc(g.categoria)+'</div>'+g.items.map(function(it){
        var id=it.nombre.toLowerCase()+'|'+it.unidad.toLowerCase();
        var on=marcados.indexOf(id)>=0; if(on)hechos++;
        var i=_lcPlano.push(id)-1;
        return '<div class="lc-item'+(on?' done':'')+'" onclick="lcMarcar('+i+')">'
          +'<span class="lc-box"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>'
          +'<span class="lc-nm">'+esc(it.nombre)+'</span>'
          +'<span class="lc-qty">'+esc(listaCompra.formatearCantidad(it.cantidad,it.unidad))+'</span></div>';
      }).join('');
    }).join('');

    document.getElementById('lcSub').textContent=_lcTitulo()+' · '+hechos+'/'+total+' marcados';
    document.getElementById('lcProg').style.width=(total?Math.round(hechos*100/total):0)+'%';
  }

  function lcMarcar(pos){
    var id=_lcPlano[pos]; if(id==null)return;
    var l=_lcMarcados(), i=l.indexOf(id);
    if(i>=0) l.splice(i,1); else l.push(id);
    _lcGuardar(l);
    lcPintar();
  }

  function _lcBaja(blob, nombre){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=nombre;
    document.body.appendChild(a); a.click(); a.remove();
    // Sin revocar, el blob se queda en memoria hasta recargar la página.
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }

  function _lcNombre(ext){
    return 'lista-compra-'+(_lcVista==='dia'?'dia':'semana')+'.'+ext;
  }

  /* Descarga lo que se está viendo, en el formato pedido.

     La IMAGEN se dibuja aquí, en el navegador: es para mandarla por WhatsApp a
     quien hace la compra, y una foto se ve en la conversación.

     El PDF lo dibuja el servidor con la misma librería que las dietas y las
     rutinas, para que el papel se parezca al resto de la aplicación. Se le
     manda la lista YA CALCULADA: si el servidor rehiciera las cuentas habría
     dos versiones de la misma suma, y tarde o temprano el papel diría una cosa
     y la pantalla otra. */
  async function lcDescargar(formato){
    var grupos=_lcGrupos();
    if(!listaCompra.contarItems(grupos)){ soon2('No hay nada que descargar.'); return; }
    var titulo='Lista de la compra';
    var subtitulo=_lcTitulo()+((_days[0] && _days[0].date)?(' · semana del '+_lcDia(_days[0].date)):'');

    if(formato==='png'){
      var lienzo=listaCompra.listaComoImagen(grupos, titulo, subtitulo);
      lienzo.toBlob(function(b){
        if(!b){ soon2('No se ha podido crear la imagen.'); return; }
        _lcBaja(b, _lcNombre('png'));
      }, 'image/png');
      return;
    }

    var btn=document.getElementById('lcPdf');
    var antes=btn?btn.innerHTML:null;
    if(btn){ btn.disabled=true; btn.textContent='Creando PDF…'; }
    try{
      var r=await fetch(API+'/client/shopping-list/pdf',{
        method:'POST', headers:headers(),
        body:JSON.stringify({titulo:titulo, subtitulo:subtitulo,
          grupos:grupos.map(function(g){ return {categoria:g.categoria,
            items:g.items.map(function(it){ return {nombre:it.nombre,
              cantidad:listaCompra.formatearCantidad(it.cantidad,it.unidad)}; })}; })}),
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      _lcBaja(await r.blob(), _lcNombre('pdf'));
    }catch(e){
      // Decirlo. Un botón que no hace nada se lee como que la aplicación está
      // rota, y aquí sigue estando la imagen como alternativa.
      soon2('No se ha podido crear el PDF. Prueba con la imagen.');
    }finally{
      if(btn){ btn.disabled=false; btn.innerHTML=antes; }
    }
  }

  function _lcDia(iso){
    try{ var d=new Date(iso+'T00:00:00');
      return d.getDate()+'/'+(d.getMonth()+1); }catch(e){ return ''; }
  }

  function soon2(msg, err){ const t=document.getElementById('toast'); t.textContent=msg;
    t.className='toast show'+(err?' err':''); clearTimeout(_tt);
    _tt=setTimeout(()=>t.classList.remove('show'),2200); }

  document.addEventListener('keydown',function(e){ if(e.key==='Escape') cerrarLista(); });

  /* Las recetas se piden al entrar aunque la pestaña esté cerrada: es lo que
     le pone el número al rótulo ("Recetas (12)"), y sin él la pestaña no dice
     si hay algo detrás o está vacía. */
  loadProfile(); loadNutrition(); cargarRecetas();
</script>
